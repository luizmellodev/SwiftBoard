<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SwiftBoard</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="sb-shell">
    <aside class="sb-sidebar">
      <div class="sb-sidebar-header">
        <span class="sb-logo">SwiftBoard</span>
        <div class="sb-header-actions">
          <a class="sb-icon-button" href="/docs" target="_blank" title="Help &amp; docs" aria-label="Help and docs">?</a>
          <button id="theme-toggle" class="sb-icon-button" title="Toggle theme" aria-label="Toggle theme">
            <span id="theme-icon">&#9789;</span>
          </button>
        </div>
      </div>
      <div class="sb-search-wrap">
        <input id="search" class="sb-search" type="text" placeholder="Search components…" autocomplete="off" />
      </div>
      <nav id="sidebar-nav" class="sb-nav"></nav>
      <div id="sidebar-actions" class="sb-actions" hidden></div>
    </aside>
    <main class="sb-main">
      <div id="breadcrumb" class="sb-breadcrumb"></div>
      <section id="component-docs" class="sb-component-docs" hidden></section>
      <div id="grid" class="sb-grid"></div>
      <div id="empty-state" class="sb-empty-state" hidden>
        <p>No components registered yet.</p>
        <p class="sb-empty-hint">Call <code>SwiftBoard.shared.addScenarios(...)</code> in your app, then reload.</p>
      </div>
    </main>
  </div>
  <div id="lightbox" class="sb-lightbox" hidden>
    <button type="button" id="lightbox-close" class="sb-lightbox-close" aria-label="Close">×</button>
    <img id="lightbox-img" alt="" />
    <p id="lightbox-caption" class="sb-lightbox-caption"></p>
  </div>
  <script src="/app.js"></script>
</body>
</html>
